name: Elliot - Verify AI Pull Request Claims
description: "Checks every claim in a pull request description against the code, with file:line proof. Can block the merge."
author: Emanuele Cella
branding:
  icon: check-circle
  color: blue
inputs:
  mode:
    description: 'report (default, non-blocking) or strict (fail when verdict is not pass).'
    required: false
    default: report
  anthropic_api_key:
    description: Anthropic API key used by Claude Code to read the code. Store it as a repository secret.
    required: true
  github_token:
    description: "Token used to post the comment. The default workflow token is enough with `pull-requests: write` permission."
    required: false
    default: ${{ github.token }}
  model:
    description: Optional Claude model id passed to Claude Code.
    required: false
    default: ""
  claude_code_version:
    description: Claude Code npm version to install.
    required: false
    default: "2.1.307"
outputs:
  verdict:
    description: "pass only on supported evidence; findings, inconclusive, or skipped otherwise."
    value: ${{ steps.run.outputs.verdict }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      run: bash "${{ github.action_path }}/action/run.sh"
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GH_TOKEN: ${{ inputs.github_token }}
        ELLIOT_MODEL: ${{ inputs.model }}
        ELLIOT_CC_VERSION: ${{ inputs.claude_code_version }}
        ELLIOT_ACTION_PATH: ${{ github.action_path }}
    - name: Apply verdict policy
      shell: bash
      run: node "${{ github.action_path }}/action/enforce.mjs"
      env:
        ELLIOT_MODE: ${{ inputs.mode }}
        ELLIOT_VERDICT: ${{ steps.run.outputs.verdict }}
