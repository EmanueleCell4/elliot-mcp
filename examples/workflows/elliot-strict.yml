# Elliot as a required pre-merge check.
#
# Copy this file to .github/workflows/elliot.yml in your repository, then:
#   1. Add your Anthropic API key as a repository secret named ANTHROPIC_API_KEY
#      (Settings -> Secrets and variables -> Actions -> New repository secret).
#   2. Make it required: Settings -> Branches -> branch protection rule for your
#      default branch -> "Require status checks to pass" -> select "Elliot / check".
#
# What it does: reads the pull request description, checks each claim against the
# code at the head commit, and comments with file:line proof. In strict mode the
# check fails unless every claim is supported by evidence it could verify.
#
# Note: this workflow runs on `pull_request`, so it does not run with repository
# secrets for pull requests from forks. Validate fork isolation before changing that.

name: Elliot

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: EmanueleCell4/elliot-mcp@v0.7.0
        with:
          mode: strict
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
