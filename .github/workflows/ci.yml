name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install bubblewrap on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: Install dependencies
        run: npm ci
      - name: Static and security checks
        run: npm run check
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Run complete test suite
        id: tests
        shell: bash
        run: |
          set +e
          npm test > test-results.tap 2>&1
          result=$?
          cat test-results.tap
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit "$result"
      - name: Publish test counts
        if: always()
        run: node scripts/test-summary.mjs test-results.tap >> "$GITHUB_STEP_SUMMARY"
