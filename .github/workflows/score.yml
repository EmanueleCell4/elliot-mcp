name: ELLIOT Score

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      repos:
        description: "Repositories to score, space-separated owner/repo (empty = only rebuild the site)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: elliot-score
  cancel-in-progress: false

jobs:
  score:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'score-request')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      issues: write
    outputs:
      built: ${{ steps.site.outputs.built }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --omit=dev --no-audit --no-fund

      - name: Which repositories
        id: which
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          INPUT_REPOS: ${{ github.event.inputs.repos }}
          DAILY_LIMIT: ${{ vars.ELLIOT_DAILY_LIMIT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            TODAY=$(date -u +%Y-%m-%d)
            COUNT=$(gh issue list --repo "$GITHUB_REPOSITORY" --label score-request --state all --search "created:>=$TODAY" --json number --jq length || echo 0)
            if [ "$COUNT" -gt "${DAILY_LIMIT:-20}" ]; then
              echo "daily limit reached ($COUNT requests today)"; echo "repos=" >> "$GITHUB_OUTPUT"; echo "limited=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            CANDIDATES=$(printf '%s' "$ISSUE_BODY" | grep -oE 'github\.com/[A-Za-z0-9-]+/[A-Za-z0-9._-]+' | head -1 | sed -E 's#^github\.com/##; s#\.git$##' || true)
          else
            CANDIDATES="$INPUT_REPOS"
          fi
          OK=""
          for R in $CANDIDATES; do
            if ! [[ "$R" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]]; then echo "skip invalid: $R"; continue; fi
            if ! INFO=$(gh api "repos/$R" 2>/dev/null); then echo "skip unreachable: $R"; continue; fi
            if [ "$(echo "$INFO" | jq -r '.private')" != "false" ]; then echo "skip private: $R"; continue; fi
            OK="$OK $(echo "$INFO" | jq -r '.full_name')"
          done
          echo "repos=$(echo $OK)" >> "$GITHUB_OUTPUT"
          echo "repos to score: ${OK:-none}"

      - name: Install Claude Code
        if: steps.which.outputs.repos != ''
        run: npm install -g --no-audit --no-fund @anthropic-ai/claude-code@2.1.307

      - name: Check out the scores branch
        run: |
          set -euo pipefail
          git config user.name "ELLIOT"
          git config user.email "elliot-score@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin scores > /dev/null; then
            git fetch --depth 1 origin scores
            git worktree add scores-data origin/scores
            git -C scores-data checkout -B scores
          else
            git worktree add --orphan -b scores scores-data
          fi
          mkdir -p scores-data/data

      - name: Score
        if: steps.which.outputs.repos != ''
        env:
          REPOS: ${{ steps.which.outputs.repos }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELLIOT_MODEL: ${{ vars.ELLIOT_MODEL }}
          ELLIOT_AUDIT_BUDGET_USD: ${{ vars.ELLIOT_AUDIT_BUDGET_USD }}
          REPORT_KEY: ${{ secrets.ELLIOT_REPORT_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          : > results.txt
          for R in $REPOS; do
            FILE="scores-data/data/$(echo "$R" | tr '/' '_' | sed 's/_/__/').json"
            HEAD=$(gh api "repos/$R/commits/HEAD" --jq .sha 2>/dev/null || echo "")
            if [ -f "$FILE" ] && [ -n "$HEAD" ] && [ "$(jq -r .commit "$FILE")" = "$HEAD" ]; then
              echo "$R unchanged since its last score"; echo "$R reused" >> results.txt; continue
            fi
            if TARGET_REPO="$R" OUT_RECORD="$RUNNER_TEMP/record.json" bash score/run.sh; then
              cp "$RUNNER_TEMP/record.json" "$FILE"; echo "$R scored" >> results.txt
              # The full report holds unfixed findings: keep it only encrypted, for the maintainers.
              FULL="$RUNNER_TEMP/elliot-score/target/.elliot-score/report/claims.json"
              if [ -n "${REPORT_KEY:-}" ] && [ -f "$FULL" ]; then
                mkdir -p scores-data/reports
                openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:REPORT_KEY -in "$FULL" \
                  -out "scores-data/reports/$(basename "$FILE" .json)-$(jq -r .commit "$FILE" | cut -c1-7).json.enc"
              fi
            else
              echo "$R failed" >> results.txt
            fi
          done
          cat results.txt

      - name: Save scores
        run: |
          set -euo pipefail
          cd scores-data
          git add -A data
          [ -d reports ] && git add -A reports
          if ! git diff --cached --quiet; then
            git commit -q -m "Update ELLIOT scores"
            git push -q origin scores
          fi

      - name: Build site
        id: site
        run: |
          node score/build-site.mjs scores-data/data _site
          echo "built=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Reply on the request
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPOS: ${{ steps.which.outputs.repos }}
          LIMITED: ${{ steps.which.outputs.limited }}
          SITE: https://emanuelecell4.github.io/elliot-mcp
        run: |
          set -uo pipefail
          R="${REPOS%% *}"
          FILE="scores-data/data/$(echo "$R" | tr '/' '_' | sed 's/_/__/').json"
          if [ "${LIMITED:-}" = "true" ]; then
            gh issue comment "$ISSUE" --body "ELLIOT has reached today's limit of free scores. This request stays open and will be picked up tomorrow."
            exit 0
          elif [ -z "$R" ]; then
            BODY="ELLIOT couldn't find a public GitHub repository in this request. Paste a URL like \`https://github.com/owner/repo\` in a new request."
          elif [ -f "$FILE" ]; then
            S=$(jq -r 'if .score == null then "not scored (fewer than 5 checkable promises)" else "\(.score)/10" end' "$FILE")
            K=$(jq -r '"\(.promises_kept) of \(.promises_checked)"' "$FILE")
            BADGE="https://img.shields.io/endpoint?url=$SITE/badge/$R.json"
            BODY=$(printf '**%s: ELLIOT score %s**\n\n%s documented promises hold up in the code. Full page: %s/r/%s/\n\nShow it in your README:\n```\n[![ELLIOT score](%s)](%s/r/%s/)\n```\nDetails of broken promises are shared with the maintainers and never published while unfixed.' "$R" "$S" "$K" "$SITE" "$R" "$BADGE" "$SITE" "$R")
          else
            BODY="ELLIOT couldn't finish scoring \`$R\` this time (it may be too large, or have too few docs to check). It will be retried on the next request."
          fi
          gh issue comment "$ISSUE" --body "$BODY"
          gh issue close "$ISSUE" --reason completed || true

  deploy:
    needs: score
    if: always() && needs.score.outputs.built == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
