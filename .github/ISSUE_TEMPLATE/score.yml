name: Get an ELLIOT Score
description: ELLIOT checks every promise in a public repository's docs against its code and gives it a score.
title: "Score: "
labels: ["score-request"]
body:
  - type: markdown
    attributes:
      value: |
        Paste a **public** GitHub repository and submit. ELLIOT audits it and replies here with the score, usually within 15 minutes.
        Scores and counts are public; details of broken promises go to the maintainers first and are never published while unfixed. [How scores work](https://emanuelecell4.github.io/elliot-mcp/method.html).
  - type: input
    id: repo
    attributes:
      label: Repository
      description: The GitHub URL of a public repository.
      placeholder: https://github.com/owner/repo
    validations:
      required: true
